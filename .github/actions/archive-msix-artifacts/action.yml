name: Archive MSIX artifacts
description: Uploads a platform's MSIX package and, optionally, its runtime payload.

inputs:
  platform:
    description: Build platform, such as x64 or ARM64.
    required: true
  include-runtime-payload:
    description: Whether to upload the executable and runtime files.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Archive runtime payload
      if: ${{ inputs.include-runtime-payload == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: snapview-runtime-${{ inputs.platform }}
        path: |
          artifacts\bin\SnapView\release-*\*.exe
          artifacts\bin\SnapView\release-*\*.dll
          artifacts\bin\SnapView\release-*\*.pri
          artifacts\bin\SnapView\release-*\*.winmd
          artifacts\bin\SnapViewOptions\release-*\SnapViewOptions.exe
          artifacts\bin\SnapViewOptions\release-*\SnapViewOptions.pri
        if-no-files-found: error

    - name: Archive MSIX package
      uses: actions/upload-artifact@v7
      with:
        name: snapview-msix-${{ inputs.platform }}
        path: artifacts\publish\release\**\SnapViewPackage_*.msix
        if-no-files-found: error
