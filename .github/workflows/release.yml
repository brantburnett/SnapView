name: Release

on:
  push:
    tags:
      - v*
      - V*

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.values }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        uses: CenterEdge/actions/dotnet/nuget-version@4f48ad964c672c289002dbb4c1e4a641ba19c771 # main
        with:
          tag-prefix: '[vV]'

      - id: platforms
        shell: pwsh
        run: |
          [xml]$solution = Get-Content -Raw SnapView.slnx
          $platforms = @($solution.Solution.Configurations.Platform | ForEach-Object Name | Sort-Object -Unique)

          if ($platforms.Count -eq 0) {
            throw "SnapView.slnx does not declare any build platforms."
          }

          "values=$(ConvertTo-Json -InputObject $platforms -Compress)" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-windows-build

      - name: Validate Store package publisher
        shell: pwsh
        env:
          MS_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MS_STORE_PACKAGE_IDENTITY_NAME }}
          MS_STORE_PACKAGE_PUBLISHER: ${{ vars.MS_STORE_PACKAGE_PUBLISHER }}
        run: |
          $requiredValues = @{
            MS_STORE_PACKAGE_IDENTITY_NAME = $env:MS_STORE_PACKAGE_IDENTITY_NAME
            MS_STORE_PACKAGE_PUBLISHER = $env:MS_STORE_PACKAGE_PUBLISHER
          }
          $missing = @($requiredValues.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing required Store package configuration: $($missing -join ', ')."
          }

      - name: Build executable
        shell: pwsh
        run: msbuild SnapView\SnapView.vcxproj /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} "/p:SolutionDir=${{ github.workspace }}\" "/p:Version=${{ needs.prepare.outputs.version }}"

      - name: Build unsigned MSIX package
        shell: pwsh
        env:
          MS_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MS_STORE_PACKAGE_IDENTITY_NAME }}
          MS_STORE_PACKAGE_PUBLISHER: ${{ vars.MS_STORE_PACKAGE_PUBLISHER }}
        run: msbuild SnapViewPackage\SnapViewPackage.wapproj /restore /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:BuildProjectReferences=false "/p:SolutionDir=${{ github.workspace }}\" "/p:Version=${{ needs.prepare.outputs.version }}" "/p:MSIXPackageIdentityName=$env:MS_STORE_PACKAGE_IDENTITY_NAME" "/p:MSIXPackagePublisher=$env:MS_STORE_PACKAGE_PUBLISHER"

      - name: Validate unsigned MSIX package
        shell: pwsh
        env:
          MS_STORE_PACKAGE_PUBLISHER: ${{ vars.MS_STORE_PACKAGE_PUBLISHER }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts\publish\release -Recurse -File -Filter '*.msix')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX package, but found $($packages.Count)."
          }
          tools\Test-MsixPackage.ps1 -PackagePath $packages[0].FullName -ExpectedIdentityName $env:MS_STORE_PACKAGE_IDENTITY_NAME -ExpectedPublisher $env:MS_STORE_PACKAGE_PUBLISHER

      - uses: ./.github/actions/archive-msix-artifacts
        with:
          platform: ${{ matrix.platform }}

  bundle:
    needs:
      - prepare
      - build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download unsigned MSIX packages
        uses: actions/download-artifact@v8
        with:
          pattern: snapview-msix-*
          path: packages

      - name: Create unsigned MSIX bundle
        shell: pwsh
        run: tools\New-MsixBundle.ps1 -PackageDirectory packages -Version "${{ needs.prepare.outputs.version }}" -OutputPath "artifacts\publish\release\SnapView-${{ needs.prepare.outputs.version }}.msixbundle"

      - name: Archive MSIX bundle
        uses: actions/upload-artifact@v7
        with:
          name: snapview-msix-bundle
          path: artifacts\publish\release\*.msixbundle
          if-no-files-found: error

  publish:
    needs:
      - bundle
    runs-on: windows-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download MSIX bundle
        uses: actions/download-artifact@v8
        with:
          name: snapview-msix-bundle
          path: release

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Request Store client assertion
        shell: pwsh
        run: |
          $audience = [uri]::EscapeDataString('api://AzureADTokenExchange')
          $response = Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }

          if ([string]::IsNullOrWhiteSpace($response.value)) {
            throw 'GitHub Actions did not return an OIDC token.'
          }

          "MSSTORE_CLIENT_ASSERTION=$($response.value)" >> $env:GITHUB_ENV

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          MS_STORE_SELLER_ID: ${{ vars.MS_STORE_SELLER_ID }}
          MS_STORE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $requiredValues = @{
            MS_STORE_SELLER_ID = $env:MS_STORE_SELLER_ID
            MS_STORE_TENANT_ID = $env:MS_STORE_TENANT_ID
            MS_STORE_CLIENT_ID = $env:MS_STORE_CLIENT_ID
          }
          $missing = @($requiredValues.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing required Store publishing configuration: $($missing -join ', ')."
          }

          msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientAssertion

      - name: Publish MSIX bundle to Store flight
        shell: pwsh
        env:
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          MS_STORE_FLIGHT_ID: ${{ vars.MS_STORE_FLIGHT_ID }}
        run: |
          $requiredValues = @{
            MS_STORE_PRODUCT_ID = $env:MS_STORE_PRODUCT_ID
            MS_STORE_FLIGHT_ID = $env:MS_STORE_FLIGHT_ID
          }
          $missing = @($requiredValues.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing required Store flight configuration: $($missing -join ', ')."
          }

          $bundles = @(Get-ChildItem -Path release -File -Filter '*.msixbundle')
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one MSIX bundle, but found $($bundles.Count)."
          }

          msstore publish $bundles[0].FullName --appId $env:MS_STORE_PRODUCT_ID --flightId $env:MS_STORE_FLIGHT_ID
